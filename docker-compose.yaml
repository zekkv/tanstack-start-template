name: tanstack-start-template

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: mailpit
    ports:
      - 1025:1025
      - 8025:8025
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    ports:
      - 5432:5432
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql; mounting the old /data path loses it.
      - ./data/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    container_name: seaweedfs
    ports:
      - 8333:8333
    volumes:
      - ./data/seaweedfs:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    # The image entrypoint drops privileges to the `seaweed` user. The identity file keeps the
    # gateway authenticated; the app bucket is created on the first upload for admin identities.
    # Its credentials must match S3_ACCESS_KEY / S3_SECRET_KEY in .env.
    command: ["server", "-s3", "-s3.iam=false", "-s3.config=/etc/seaweedfs/s3.json"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 10
  tanstack-start-template:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanstack-start-template
    ports:
      - 3000:3000
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
